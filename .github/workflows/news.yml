name: news
on:
  schedule:
    - cron: "13 22-23,0-15 * * *"   # hourly 06:13-23:13 HKT
    - cron: "13 17,20 * * *"        # 01:13 and 04:13 HKT
  workflow_dispatch:
concurrency: {group: news, cancel-in-progress: false}
permissions:
  contents: write
env:
  PYTHONPATH: src
  TZ: Asia/Hong_Kong
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - id: run
        run: python -m cfa.collect_news || echo "failed=1" >> "$GITHUB_OUTPUT"
      - run: python -m cfa.news_prep
      - run: scripts/commit_push.sh "news $(date +'%F %H:%M')"
      - if: steps.run.outputs.failed == '1'
        run: echo "::error::fewer than 2 news sources worked" && exit 1

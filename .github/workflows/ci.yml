name: ci
on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "requirements.txt"]
  pull_request:
env:
  PYTHONPATH: src
  TZ: Asia/Hong_Kong
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - run: python -m pytest -q tests

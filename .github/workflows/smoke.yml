name: smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/kick/smoke", "src/cfa/smoke_test.py", "src/cfa/collect_*.py", "config/sources.yaml", "requirements.txt"]
permissions:
  contents: write
env:
  PYTHONPATH: src
  TZ: Asia/Hong_Kong
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - run: python -m cfa.smoke_test
      - run: cat state/smoke.md >> "$GITHUB_STEP_SUMMARY"
      - run: scripts/commit_push.sh "smoke test $(date +'%F %H:%M')"

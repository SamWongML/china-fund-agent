name: briefs-pages
# Publishes briefs/ (the HTML brief of each scheduled task) to GitHub Pages:
# https://samwongml.github.io/china-fund-agent/
# Inactive until Pages is turned on once: Settings > Pages > Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ["briefs/**"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event.repository.has_pages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: briefs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: briefs
      - id: deploy
        uses: actions/deploy-pages@v4

name: weekly-build
on:
  schedule:
    - cron: "17 22 * * 6"   # Sun 06:17 HKT
  workflow_dispatch:
concurrency: {group: weekly, cancel-in-progress: false}
permissions:
  contents: write
env:
  PYTHONPATH: src
  TZ: Asia/Hong_Kong
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - run: python -m cfa.weekly_build
      - run: scripts/commit_push.sh "weekly build $(date +%G-W%V)"

name: funds
on:
  schedule:
    - cron: "17 15 * * 1-5"   # 23:17 HKT Mon-Fri (open-end NAVs complete after 23:00)
    - cron: "47 23 * * 1-5"   # 07:47 HKT Tue-Sat catch-up
  push:
    branches: [main]
    paths: [".github/kick/funds"]   # agents can't dispatch: touching this file runs the job
  workflow_dispatch:
    inputs:
      date: {description: "trading date YYYY-MM-DD (blank = latest)", required: false}
concurrency: {group: funds, cancel-in-progress: false}
permissions:
  contents: write
env:
  PYTHONPATH: src
  TZ: Asia/Hong_Kong
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - id: run
        run: python -m cfa.collect_funds ${{ inputs.date && format('--date {0}', inputs.date) || '' }} || echo "failed=1" >> "$GITHUB_OUTPUT"
      - run: scripts/commit_push.sh "funds snapshot $(date +%F)"
      - if: steps.run.outputs.failed == '1'
        run: echo "::error::core fund snapshot incomplete, see state/status.json" && exit 1

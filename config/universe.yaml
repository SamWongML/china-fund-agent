# Themes map news keywords to onshore ETFs so news can be counted per theme (closed vocabulary).
# ETF codes are a starting watchlist; the weekly build logs any code missing from the ETF snapshot.
# Edit freely: add themes, swap ETFs, add keywords.

benchmarks:
  primary: sh000300      # CSI 300, used for excess return in the scorecard
  others: [sh000905, sz399006, sh000922]

themes:
  broad_large:   {etfs: ["510300"], keywords: [沪深300, 大盘, 蓝筹, A股]}
  broad_mid:     {etfs: ["510500"], keywords: [中证500, 中小盘]}
  growth_chinext: {etfs: ["159915"], keywords: [创业板]}
  star_tech:     {etfs: ["588000"], keywords: [科创板, 科创50]}
  semis:         {etfs: ["512480", "159995"], keywords: [半导体, 芯片, 光刻, 晶圆, 存储, 集成电路]}
  ai_compute:    {etfs: ["159819", "515880"], keywords: [人工智能, AI, 大模型, 算力, 数据中心, 通信, 光模块]}
  brokers:       {etfs: ["512880"], keywords: [券商, 证券公司, 成交额, 两融, 融资余额]}
  banks:         {etfs: ["512800"], keywords: [银行, 净息差, 存款利率]}
  dividend:      {etfs: ["510880"], keywords: [红利, 高股息, 分红]}
  gold:          {etfs: ["518880"], keywords: [黄金, 金价, 贵金属, gold]}
  gov_bonds:     {etfs: ["511010"], keywords: [国债, 债市, 收益率, 降准, 降息, LPR]}
  new_energy_ev: {etfs: ["515030", "516160"], keywords: [新能源车, 电动车, 锂电, 电池, 比亚迪]}
  solar:         {etfs: ["515790"], keywords: [光伏, 硅料, 组件]}
  healthcare:    {etfs: ["512010", "512170"], keywords: [医药, 医疗, 创新药, 集采, 生物医药]}
  consumer:      {etfs: ["159928", "512690"], keywords: [消费, 白酒, 零售, 社零, 以旧换新]}
  defense:       {etfs: ["512660"], keywords: [军工, 国防, 航天]}
  real_estate:   {etfs: ["512200"], keywords: [房地产, 楼市, 房价, 地产]}

# Candidate screen (weekly build). Score = weighted percentile rank (0-100) of trailing returns within fund type.
# China evidence: last week's and last month's gains tend to reverse, 3-12 month trends persist, so the short
# windows carry negative weight (a "skip-month" trend). The signal layer below then re-ranks the survivors.
screen:
  max_candidates: 20
  max_per_type: 3
  max_bond_candidates: 4
  min_etf_turnover_cny: 50000000     # 5,000万 daily turnover
  chase_warning_1w_pct: 8            # flag if the last week's gain exceeds this
  exclude_name_keywords: [货币, 理财, 定开, 持有, 封闭, 养老, 港, 美, 纳斯达克, 纳指, 标普, 道琼斯, QDII, 恒生, 日经, 德国, 法国, 印度, 越南, 沙特]
  weights: {r_1w: -0.1, r_1m: -0.1, r_3m: 0.35, r_6m: 0.35, r_1y: 0.3}

# Sector and broad ETFs used for the walk-forward backtest, market breadth and satellite picks (in addition to
# the theme ETFs above). Codes without history on Sina are skipped and logged.
research_etfs: ["510050", "510300", "510500", "512100", "159915", "588000", "510880", "515080", "512890",
                "512480", "159995", "515050", "515880", "159819", "512720", "159852", "515000", "512980",
                "159869", "512880", "512000", "512070", "512800", "512400", "515220", "515210", "159870",
                "516950", "512660", "512200", "515030", "516160", "515790", "159611", "512580", "512010",
                "512170", "512290", "159992", "159883", "159928", "512690", "515170", "159996", "516110",
                "159865", "159825", "159766", "518880", "511010", "511260"]

# Signal layer (src/cfa/signals.py). Weights apply to 0-100 percentile ranks. The weekly backtest scales them:
# proven 1x, positive but unproven 0.5x, contrary evidence 0x (journal/signal_health.md).
signals:
  weights: {trend_12w: 0.25, trend_26w: 0.2, ma200_gap: 0.1, rev_1w: 0.1, max_20d: 0.1, turnover_surge: 0.1, low_vol: 0.15}
  crowding: {max_1w_pct: 8, max_1d_pct: 7, max_turnover_x: 2.5}
  cluster_corr: 0.6     # on market-relative daily returns
  backtest: {min_funds: 8, min_weeks: 150, t_min: 2.0, cost_per_trade_pct: 0.1}

# Core/satellite frame for the rules-only baseline (src/cfa/portfolio.py). Percentages of the portfolio.
portfolio:
  core: ["510880", "510300", "511010", "518880"]   # dividend, CSI 300, government bonds, gold
  core_pct: 70
  satellite_pct: 30
  satellite_slots: 3
  satellite_min_composite: 60
  drift_band_pct: 5

# Probability on every call: journal `p_up` = chance the fund beats the primary benchmark over the call's horizon.
# The journal derives `confidence` from it and rejects values outside these caps (LLM percentages run hot; see
# research/theme_watchlist in the project files).
advice:
  p_min: 0.15
  p_max: 0.85

# Theme watchlist (watchlist/themes.yaml, written by the theme-scout skill). The weekly build finds products for
# each theme by name keyword, keeps one per index family (the most liquid issuer), and the Sunday advisor
# curates at least picks_per_theme of them per active theme.
watch_themes:
  min_turnover_cny: 20000000      # 2,000万 daily turnover
  max_products: 6
  picks_per_theme: 3
  max_active: 8
  exclude_name_keywords: [港, 恒生, 纳斯达克, 纳指, 标普, 道琼斯, 日经, 德国, 法国, 中韩, 沙特, 越南, 印度, 亚太, 债, 货币,
                          日利, 添益, 短融]

# HTML briefs (src/cfa/brief.py -> briefs/*.html). up_color: red follows the mainland convention (red = up,
# green = down); set green for the Hong Kong / US convention. Arrows always show the direction.
briefs:
  up_color: red
